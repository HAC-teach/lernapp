<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Lernapps</title>
<style>
  :root { --paper: #fffaf0; --grid: #f1e8d6; --card: #ffffff; --text: #3d3528; --muted: #857a66; --border: #e6dcc6;
    --accent: #f2a541; --mark: #ffd96a; }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #1f1c17; --grid: #2a261f; --card: #28241e; --text: #ede5d6; --muted: #a89d88; --border: #3b352c;
      --accent: #f0a24a; --mark: rgba(255, 200, 60, .35); }
  }
  body { margin: 0; color: var(--text); background-color: var(--paper);
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 22px 22px; font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 480px; margin: 15vh auto 0; padding: 0 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-top: 5px solid var(--accent);
    border-radius: 8px; padding: 24px; text-align: center; box-shadow: 0 2px 0 var(--border); }
  h1 { display: inline-block; font-size: 1.5rem; font-weight: 700; margin: 0 0 8px; padding: 0 4px;
    background: linear-gradient(transparent 60%, var(--mark) 60%); }
  p { color: var(--muted); margin: 0; }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>Lernapps</h1>
    <p>Bitte öffne den Link, den du von deiner Lehrkraft bekommen hast.</p>
  </div>
</main>
</body>
</html>
