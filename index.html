<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Lernapps</title>
<style>
  :root { --bg: #f4f5f7; --card: #ffffff; --text: #3b4046; --muted: #7b838b; --border: #dfe3e7; --green: #3e9f4c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16191c; --card: #1f2327; --text: #e2e5e8; --muted: #9aa2aa; --border: #353b41; --green: #5cbd69; }
  }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 480px; margin: 15vh auto 0; padding: 0 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-top: 4px solid var(--green);
    border-radius: 10px; padding: 24px; text-align: center; }
  h1 { font-size: 1.5rem; font-weight: 600; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0; }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>Lernapps</h1>
    <p>Bitte öffne den Link, den du von deiner Lehrkraft bekommen hast.</p>
  </div>
</main>
</body>
</html>
