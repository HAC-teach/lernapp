<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Lernapps</title>
<style>
  :root { --bg: #eef6f8; --card: #ffffff; --text: #16323d; --muted: #5b7380; --border: #cfe0e6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1d23; --card: #172a32; --text: #e4f0f3; --muted: #93aab4; --border: #2a434d; }
  }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 480px; margin: 15vh auto 0; padding: 0 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; text-align: center; }
  h1 { font-size: 1.5rem; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0; }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>📚 Lernapps</h1>
    <p>Bitte öffne den Link, den du von deiner Lehrkraft bekommen hast.</p>
  </div>
</main>
</body>
</html>
