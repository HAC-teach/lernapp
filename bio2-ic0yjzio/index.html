<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light only">
<title>Lernspiele · Biologie 2. Klasse</title>
<style>
  :root { --text: #2f2a22; --ink: #2f2a22; --muted: #7c7466; --grid: #e9eef5; --mark: #ffd96a; }
  .c1 { --c: #5f9a3a; --ci: #3b6324; --soft: #e8f2df; }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--text); font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #ffffff; background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 22px 22px; }
  .top { background: rgba(255, 255, 255, .94); border-bottom: 1.5px solid var(--ink); padding: 8px 16px; }
  .top .in { max-width: 820px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .top .info { color: var(--muted); font-size: .9rem; font-weight: 600; }
  main { max-width: 820px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { font-size: 2rem; font-weight: 800; margin: 0 0 8px; }
  h1 span { padding: 0 4px; background: linear-gradient(transparent 55%, var(--mark) 55%); }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .list { display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .chapter { position: relative; display: block; background: var(--soft); color: inherit; text-decoration: none; border-radius: 2px;
    box-shadow: 1px 3px 6px rgba(0, 0, 0, .13); transform: rotate(-1deg); transition: transform .15s, box-shadow .15s; }
  .chapter::before { content: ""; position: absolute; top: -10px; left: 40%; width: 70px; height: 20px; background: rgba(255, 217, 106, .8); transform: rotate(-3deg); }
  a.chapter:hover { transform: rotate(0) translateY(-2px); box-shadow: 2px 5px 10px rgba(0, 0, 0, .16); }
  .chapter .head { display: flex; gap: 12px; align-items: baseline; padding: 18px 16px 10px; font-weight: 700; font-size: 1.15rem; }
  .chapter small { display: block; color: var(--muted); font-size: .9rem; padding: 8px 16px 14px; border-top: 1.5px dashed rgba(0, 0, 0, .15); }
  .num { flex: none; color: var(--ci); font-weight: 800; font-size: 1.6rem; line-height: 1; }
  .chapter.soon { opacity: .55; }
  @media (max-width: 480px) { h1 { font-size: 1.6rem; } .top .info { display: none; } }
</style>
</head>
<body>
<header class="top"><div class="in"><span data-marke="bio"></span><span class="info">2. Klasse</span></div></header>
<main>
  <h1><span>Kapitel</span></h1>
  <p class="sub">Wähle ein Kapitel. Du kannst die Themen durchklicken und danach ein Quiz machen.</p>
  <div class="list">
    <!-- Neues Kapitel: Ordner anlegen und hier einen Link ergänzen -->
    <a class="chapter c1" href="pflanzen-pilze/"><span class="head"><span class="num">1</span>Pflanzen und Pilze</span>
      <small>Bäume · Sporenpflanzen · Pilze</small></a>
  </div>
</main>
<script src="../marke.js"></script>
</body>
</html>
