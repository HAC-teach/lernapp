<title>Lernspiele · Deutsch 2. Klasse · Rechtschreibung</title>
<style>
  :root { --text: #2f2a22; --ink: #2f2a22; --muted: #7c7466; --grid: #e9eef5; --mark: #ffd96a; }
  .c1 { --ci: #7c2b22; --soft: #fbe6e1; }
  .c2 { --ci: #7a5614; --soft: #f8eedb; }
  .c3 { --ci: #3d6b22; --soft: #e8f3df; }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--text); font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #ffffff; background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 22px 22px; }
  .top { background: rgba(255, 255, 255, .94); border-bottom: 1.5px solid var(--ink); padding: 8px 16px; }
  .top .in { max-width: 820px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .top .info { color: var(--muted); font-size: .9rem; font-weight: 600; }
  main { max-width: 820px; margin: 0 auto; padding: 20px 16px 48px; }
  .back { display: block; width: fit-content; color: var(--muted); text-decoration: none; font-size: .95rem; font-weight: 600; margin-bottom: 12px; }
  .back:hover { color: var(--text); }
  h1 { font-size: 2rem; font-weight: 800; margin: 0 0 8px; }
  h1 span { padding: 0 4px; background: linear-gradient(transparent 55%, var(--mark) 55%); }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .list { display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .spiel { position: relative; display: block; background: var(--soft); color: inherit; text-decoration: none; border-radius: 2px;
    box-shadow: 1px 3px 6px rgba(0, 0, 0, .13); transform: rotate(-1deg); transition: transform .15s, box-shadow .15s; }
  .spiel::before { content: ""; position: absolute; top: -10px; left: 40%; width: 70px; height: 20px; background: rgba(255, 217, 106, .8); transform: rotate(-3deg); }
  a.spiel:hover { transform: rotate(0) translateY(-2px); box-shadow: 2px 5px 10px rgba(0, 0, 0, .16); }
  .spiel .head { display: block; padding: 18px 16px 10px; font-weight: 700; font-size: 1.15rem; color: var(--ci); }
  .spiel small { display: block; color: var(--muted); font-size: .9rem; padding: 8px 16px 14px; border-top: 1.5px dashed rgba(0, 0, 0, .15); }
  .empty { position: relative; margin-top: 28px; background: #fff; border: 1.5px solid var(--ink); border-radius: 2px; padding: 24px 16px; text-align: center; color: var(--muted); font-weight: 600; }
  .empty::before { content: ""; position: absolute; top: -10px; left: 40%; width: 70px; height: 20px; background: rgba(255, 217, 106, .8); transform: rotate(-3deg); }
  @media (max-width: 480px) { h1 { font-size: 1.6rem; } .top .info { display: none; } }
</style>
</head>
