<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light only">
<title>Lernspiele · Deutsch 2. Klasse</title>
<style>
  :root { --text: #2f2a22; --ink: #2f2a22; --muted: #7c7466; --grid: #e9eef5; --mark: #ffd96a; }
  .c1 { --c: #c8483b; --ci: #7c2b22; --soft: #fbe6e1; }
  .c2 { --c: #c9932a; --ci: #7a5614; --soft: #f8eedb; }
  .c3 { --c: #3a86b0; --ci: #24536d; --soft: #e2eef5; }
  .c4 { --c: #7a5fb0; --ci: #4b3a6e; --soft: #ece6f6; }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--text); font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #ffffff; background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 22px 22px; }
  .top { background: rgba(255, 255, 255, .94); border-bottom: 1.5px solid var(--ink); padding: 8px 16px; }
  .top .in { max-width: 820px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .top .info { color: var(--muted); font-size: .9rem; font-weight: 600; }
  main { max-width: 820px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { font-size: 2rem; font-weight: 800; margin: 0 0 8px; }
  h1 span, h2 span { padding: 0 4px; background: linear-gradient(transparent 55%, var(--mark) 55%); }
  h2 { font-size: 1.3rem; font-weight: 800; margin: 32px 0 18px; }
  .sub { color: var(--muted); margin: 0 0 8px; }
  .list { display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .chapter { position: relative; display: block; background: var(--soft); color: inherit; text-decoration: none; border-radius: 2px;
    box-shadow: 1px 3px 6px rgba(0, 0, 0, .13); transform: rotate(-1deg); transition: transform .15s, box-shadow .15s; }
  .chapter::before { content: ""; position: absolute; top: -10px; left: 40%; width: 70px; height: 20px; background: rgba(255, 217, 106, .8); transform: rotate(-3deg); }
  a.chapter:hover { transform: rotate(0) translateY(-2px); box-shadow: 2px 5px 10px rgba(0, 0, 0, .16); }
  .chapter .head { display: block; padding: 18px 16px 10px; font-weight: 700; font-size: 1.15rem; color: var(--ci); }
  .chapter small { display: block; color: var(--muted); font-size: .9rem; padding: 8px 16px 14px; border-top: 1.5px dashed rgba(0, 0, 0, .15); }
  @media (max-width: 480px) { h1 { font-size: 1.6rem; } .top .info { display: none; } }
</style>
</head>
<body>
<header class="top"><div class="in"><span data-marke="de"></span><span class="info">2. Klasse</span></div></header>
<main>
  <h1><span>Kapitel</span></h1>
  <p class="sub">Wähle ein Kapitel und übe mit den Lernspielen.</p>

  <!-- Neues Kapitel: Ordner anlegen und beim passenden Bereich einen Link ergänzen -->
  <h2><span>Textsorten</span></h2>
  <div class="list">
    <a class="chapter c1" href="anleitungen/"><span class="head">Anleitungen</span>
      <small>Noch keine Lernspiele</small></a>
    <a class="chapter c2" href="rezepte/"><span class="head">Rezepte</span>
      <small>Noch keine Lernspiele</small></a>
  </div>

  <h2><span>Rechtschreibung und Grammatik</span></h2>
  <div class="list">
    <a class="chapter c3" href="verb-aktiv-passiv/"><span class="head">Das Verb: Aktiv/Passiv</span>
      <small>Noch keine Lernspiele</small></a>
    <a class="chapter c4" href="verb-modus-modalverben/"><span class="head">Das Verb: Modus und Modalverben</span>
      <small>Noch keine Lernspiele</small></a>
  </div>
</main>
<script src="../marke.js"></script>
</body>
</html>
