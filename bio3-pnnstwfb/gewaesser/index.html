<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Gewässer Lernspiel</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #3b4046; --muted: #7b838b; --border: #dfe3e7;
    --accent: #2f7fe0; --accent-soft: #e7f0fc; --green: #3e9f4c; --green-soft: #eaf5eb;
    --ok: #3e9f4c; --ok-soft: #eaf5eb; --bad: #d4504a; --bad-soft: #fbeceb; --top: #fbfbfc;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16191c; --card: #1f2327; --text: #e2e5e8; --muted: #9aa2aa; --border: #353b41;
      --accent: #5d9df0; --accent-soft: #1e2e44; --green: #5cbd69; --green-soft: #1c3121;
      --ok: #5cbd69; --ok-soft: #1c3121; --bad: #ee7c76; --bad-soft: #3c2323; --top: #1b1e22; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .top { background: var(--top); border-bottom: 1px solid var(--border); padding: 14px 16px;
    font-size: .85rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .top span { display: block; max-width: 720px; margin: 0 auto; }
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 2rem; font-weight: 600; margin: 0 0 6px; }
  h2 { font-size: 1.25rem; font-weight: 600; margin: 0 0 16px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
  button { font: inherit; color: inherit; cursor: pointer; }
  .topic { text-align: left; background: var(--card); border: 2px solid var(--border); border-radius: 10px; padding: 0;
    display: flex; flex-direction: column; overflow: hidden; transition: border-color .15s; }
  .topic:hover { border-color: var(--green); }
  .topic .head { display: flex; gap: 12px; align-items: center; padding: 14px 16px; flex: 1; font-weight: 600; }
  .topic small { display: block; color: var(--muted); font-size: .85rem; padding: 8px 16px;
    background: var(--green-soft); border-top: 1px solid var(--border); }
  .topic.all { grid-column: 1 / -1; border-color: var(--green); }
  .num { flex: none; width: 34px; height: 34px; border-radius: 8px; background: var(--green); color: #fff;
    display: grid; place-items: center; font-weight: 700; font-size: .95rem; }
  .topic.all .num { font-size: .75rem; }
  .btn { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 11px 20px;
    font-weight: 600; font-size: .9rem; letter-spacing: .05em; text-transform: uppercase; }
  .btn:hover:not(:disabled) { filter: brightness(1.07); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--border); }
  .btn.ghost:hover { border-color: var(--accent); filter: none; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; color: var(--muted); font-size: .95rem; }
  .progress { height: 6px; background: var(--border); border-radius: 99px; overflow: hidden; margin-bottom: 20px; }
  .progress div { height: 100%; background: var(--green); transition: width .3s; }
  .q { font-size: 1.2rem; font-weight: 600; margin: 0 0 18px; }
  .opts { display: grid; gap: 10px; }
  .opt { text-align: left; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
  .opt:hover:not(:disabled) { border-color: var(--accent); }
  .opt.sel { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
  .opt.ok { border-color: var(--ok); background: var(--ok-soft); box-shadow: inset 0 0 0 1px var(--ok); }
  .opt.bad { border-color: var(--bad); background: var(--bad-soft); box-shadow: inset 0 0 0 1px var(--bad); }
  .opt:disabled { cursor: default; }
  .tf { grid-template-columns: 1fr 1fr; }
  .tf .opt { text-align: center; font-weight: 600; padding: 18px; }
  .seq { min-height: 52px; border: 1px dashed var(--muted); border-radius: 8px; padding: 8px; display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .seq:empty::before { content: "Tippe die Begriffe in der richtigen Reihenfolge an …"; color: var(--muted); padding: 6px; }
  .chip { background: var(--accent-soft); border: 1px solid transparent; border-radius: 6px; padding: 8px 12px; text-align: left; }
  .chip .n { display: inline-block; min-width: 1.6em; font-weight: 700; color: var(--accent); }
  .chip.ok { border-color: var(--ok); background: var(--ok-soft); }
  .chip.bad { border-color: var(--bad); background: var(--bad-soft); }
  .pool { display: flex; flex-wrap: wrap; gap: 8px; }
  .pool .opt { padding: 8px 12px; }
  .row { display: grid; grid-template-columns: 1fr 1.3fr; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .row:last-child { border-bottom: 0; }
  .row b { font-weight: 600; }
  select { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 9px 10px; width: 100%; }
  select:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  select.ok { border-color: var(--ok); background: var(--ok-soft); }
  select.bad { border-color: var(--bad); background: var(--bad-soft); }
  .fix { grid-column: 2; font-size: .9rem; color: var(--ok); }
  .feedback { margin-top: 18px; border-radius: 8px; padding: 12px 14px; border-left: 4px solid; }
  .feedback.ok { background: var(--ok-soft); border-color: var(--ok); }
  .feedback.bad { background: var(--bad-soft); border-color: var(--bad); }
  .feedback strong { display: block; }
  .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }
  .big { font-size: 3rem; font-weight: 700; color: var(--green); margin: 8px 0; }
  .center { text-align: center; }
  .review { margin-top: 20px; text-align: left; }
  .review li { margin-bottom: 10px; }
  .review span { color: var(--muted); display: block; font-size: .92rem; }
  .streak { font-weight: 700; color: var(--green); }
  .back { display: inline-block; color: var(--muted); text-decoration: none; font-size: .85rem; font-weight: 600;
    letter-spacing: .05em; text-transform: uppercase; margin-bottom: 14px; }
  .back:hover { color: var(--accent); }
  .learn ul { margin: 0; padding-left: 1.2em; }
  .learn li { margin-bottom: 8px; }
  .tip { margin-top: 16px; background: var(--green-soft); border-left: 4px solid var(--green); border-radius: 8px; padding: 10px 14px; }
  .dots { display: flex; gap: 6px; justify-content: center; margin-top: 16px; }
  .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--border); }
  .dots i.on { background: var(--green); }
  .skip { background: none; border: 0; color: var(--accent); text-decoration: underline; padding: 0; }
  footer { color: var(--muted); font-size: .85rem; text-align: center; margin-top: 32px; }
  @media (max-width: 480px) { .row { grid-template-columns: 1fr; } .fix { grid-column: 1; } h1 { font-size: 1.6rem; } }
</style>
</head>
<body>
<header class="top"><span>Biologie · 3. Klasse</span></header>
<main id="app"></main>
<script src="questions.js"></script>
<script src="lernen.js"></script>
<script>
const app = document.getElementById("app");
const ROUND_SIZE = 10;
let state = null;

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function loadBest() { try { return JSON.parse(localStorage.getItem("gewaesser-best") || "{}"); } catch { return {}; } }
function saveBest(id, pct) {
  try { const b = loadBest(); if (!(b[id] >= pct)) { b[id] = pct; localStorage.setItem("gewaesser-best", JSON.stringify(b)); } } catch {}
}

function home() {
  const best = loadBest();
  const tile = (id, badge, title, count, cls = "") =>
    `<button class="topic ${cls}" data-id="${id}"><span class="head"><span class="num">${badge}</span>${esc(title)}</span>
      <small>${id === "all" ? "" : `${(LESSONS[id] || []).length} Lernkarten · `}${count} Fragen${best[id] != null ? ` · Bestwert ${best[id]} %` : ""}</small></button>`;
  app.innerHTML = `
    <a class="back" href="../">← Alle Kapitel</a>
    <h1>1. Gewässer</h1>
    <p class="sub">Wähle ein Thema: Zuerst lernst du mit den Karten, dann testest du dein Wissen im Quiz.</p>
    <div class="grid">
      ${tile("all", "Mix", "Alle Themen gemischt", QUESTIONS.length, "all")}
      ${TOPICS.map((t, n) => tile(t.id, n + 1, t.title, QUESTIONS.filter(q => q.topic === t.id).length)).join("")}
    </div>
    <footer>Jede Runde: bis zu ${ROUND_SIZE} zufällige Fragen</footer>`;
  app.querySelectorAll(".topic").forEach(b => b.onclick = () => b.dataset.id === "all" ? start("all") : learn(b.dataset.id, 0));
}

function learn(id, i) {
  const cards = LESSONS[id] || [];
  if (!cards.length) return start(id);
  const t = TOPICS.find(t => t.id === id), c = cards[i], last = i === cards.length - 1;
  app.innerHTML = `
    <div class="bar"><button class="btn ghost" id="quit" style="padding:6px 12px">← Themen</button>
      <span>${esc(t.title)}</span>
      <span>Karte ${i + 1} / ${cards.length}</span></div>
    <div class="card learn">
      <h2>${esc(c.title)}</h2>
      <ul>${c.points.map(p => `<li>${esc(p)}</li>`).join("")}</ul>
      ${c.tip ? `<div class="tip"><b>Tipp:</b> ${esc(c.tip)}</div>` : ""}
      <div class="dots">${cards.map((_, j) => `<i class="${j === i ? "on" : ""}"></i>`).join("")}</div>
      <div class="actions">
        ${i > 0 ? `<button class="btn ghost" id="prev">← Zurück</button>` : ""}
        <button class="btn" id="next">${last ? "Quiz starten" : "Weiter →"}</button>
      </div>
    </div>
    ${last ? "" : `<p class="center"><button class="skip" id="toquiz">Direkt zum Quiz</button></p>`}`;
  document.getElementById("quit").onclick = home;
  document.getElementById("next").onclick = () => last ? start(id) : learn(id, i + 1);
  if (i > 0) document.getElementById("prev").onclick = () => learn(id, i - 1);
  if (!last) document.getElementById("toquiz").onclick = () => start(id);
  window.scrollTo(0, 0);
}

function start(id) {
  const pool = id === "all" ? QUESTIONS : QUESTIONS.filter(q => q.topic === id);
  state = { id, list: shuffle(pool).slice(0, ROUND_SIZE), i: 0, score: 0, streak: 0, wrong: [] };
  render();
}

function render() {
  const q = state.list[state.i];
  const n = state.list.length;
  state.answered = false;
  state.pick = null;
  app.innerHTML = `
    <div class="bar"><button class="btn ghost" id="quit" style="padding:6px 12px">← Themen</button>
      <span>Frage ${state.i + 1} / ${n}</span>
      <span>${state.score} Punkte${state.streak >= 3 ? ` · <span class="streak">${state.streak} in Folge</span>` : ""}</span></div>
    <div class="progress"><div style="width:${state.i / n * 100}%"></div></div>
    <div class="card">
      <p class="q">${esc(q.q)}</p>
      <div id="body"></div>
      <div id="fb"></div>
      <div class="actions"><button class="btn" id="go" disabled>Prüfen</button></div>
    </div>`;
  document.getElementById("quit").onclick = home;
  const go = document.getElementById("go");
  go.onclick = () => state.answered ? next() : check();
  ({ mc: renderMC, tf: renderTF, order: renderOrder, match: renderMatch })[q.type](q, document.getElementById("body"), go);
}

function renderMC(q, el, go) {
  const order = shuffle(q.options.map((_, i) => i));
  el.innerHTML = `<div class="opts">${order.map(i => `<button class="opt" data-i="${i}">${esc(q.options[i])}</button>`).join("")}</div>`;
  el.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    el.querySelectorAll(".opt").forEach(x => x.classList.remove("sel"));
    b.classList.add("sel"); state.pick = +b.dataset.i; go.disabled = false;
  });
  state.grade = () => {
    const ok = state.pick === q.answer;
    el.querySelectorAll(".opt").forEach(b => {
      b.disabled = true;
      if (+b.dataset.i === q.answer) b.classList.add("ok");
      else if (b.classList.contains("sel")) b.classList.add("bad");
    });
    return { ok, correct: q.options[q.answer] };
  };
}

function renderTF(q, el, go) {
  el.innerHTML = `<div class="opts tf"><button class="opt" data-v="1">Richtig</button><button class="opt" data-v="0">Falsch</button></div>`;
  el.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    el.querySelectorAll(".opt").forEach(x => x.classList.remove("sel"));
    b.classList.add("sel"); state.pick = b.dataset.v === "1"; go.disabled = false;
  });
  state.grade = () => {
    const ok = state.pick === q.answer;
    el.querySelectorAll(".opt").forEach(b => {
      b.disabled = true;
      if ((b.dataset.v === "1") === q.answer) b.classList.add("ok");
      else if (b.classList.contains("sel")) b.classList.add("bad");
    });
    return { ok, correct: q.answer ? "Richtig" : "Falsch" };
  };
}

function renderOrder(q, el, go) {
  let pool = shuffle(q.items);
  while (pool.length > 1 && pool.every((x, i) => x === q.items[i])) pool = shuffle(q.items);
  const seq = [];
  const draw = () => {
    el.innerHTML = `
      <div class="seq">${seq.map((s, i) => `<button class="chip" data-i="${i}"><span class="n">${i + 1}.</span>${esc(s)}</button>`).join("")}</div>
      <div class="pool">${pool.map((s, i) => `<button class="opt" data-i="${i}">${esc(s)}</button>`).join("")}</div>`;
    el.querySelectorAll(".pool .opt").forEach(b => b.onclick = () => { seq.push(pool.splice(+b.dataset.i, 1)[0]); draw(); });
    el.querySelectorAll(".seq .chip").forEach(b => b.onclick = () => { pool.push(seq.splice(+b.dataset.i, 1)[0]); draw(); });
    go.disabled = pool.length > 0;
  };
  draw();
  state.grade = () => {
    const ok = seq.every((s, i) => s === q.items[i]);
    el.querySelectorAll(".seq .chip").forEach((b, i) => { b.disabled = true; b.classList.add(seq[i] === q.items[i] ? "ok" : "bad"); });
    return { ok, correct: q.items.join(" → ") };
  };
}

function renderMatch(q, el, go) {
  const answers = shuffle([...new Set(q.pairs.map(p => p[1]))]);
  const rows = shuffle(q.pairs);
  el.innerHTML = rows.map((p, i) => `
    <div class="row"><b>${esc(p[0])}</b>
      <select data-i="${i}"><option value="">– wählen –</option>${answers.map(a => `<option>${esc(a)}</option>`).join("")}</select></div>`).join("");
  const sels = [...el.querySelectorAll("select")];
  sels.forEach(s => s.onchange = () => { go.disabled = sels.some(x => !x.value); });
  state.grade = () => {
    let ok = true;
    sels.forEach((s, i) => {
      s.disabled = true;
      const right = s.value === rows[i][1];
      s.classList.add(right ? "ok" : "bad");
      if (!right) { ok = false; s.parentElement.insertAdjacentHTML("beforeend", `<span class="fix">Richtig: ${esc(rows[i][1])}</span>`); }
    });
    return { ok, correct: q.pairs.map(p => `${p[0]} – ${p[1]}`).join("; ") };
  };
}

function check() {
  const q = state.list[state.i];
  const { ok, correct } = state.grade();
  state.answered = true;
  if (ok) { state.score++; state.streak++; } else { state.streak = 0; state.wrong.push({ q, correct }); }
  const praise = ["Super!", "Richtig!", "Genau!", "Sehr gut!", "Toll!"];
  document.getElementById("fb").innerHTML = `
    <div class="feedback ${ok ? "ok" : "bad"}"><strong>${ok ? praise[Math.floor(Math.random() * praise.length)] : "Leider nicht ganz."}</strong>${esc(q.info || "")}</div>`;
  const go = document.getElementById("go");
  go.textContent = state.i + 1 < state.list.length ? "Weiter →" : "Ergebnis anzeigen";
  go.disabled = false;
  go.focus();
}

function next() {
  state.i++;
  if (state.i < state.list.length) render(); else result();
}

function result() {
  const n = state.list.length, pct = Math.round(state.score / n * 100);
  saveBest(state.id, pct);
  const msg = pct === 100 ? "Perfekt! Du bist ein Gewässer-Profi!" : pct >= 80 ? "Sehr gut gemacht!" : pct >= 50 ? "Gut! Mit etwas Übung schaffst du noch mehr." : "Wiederhole das Thema noch einmal – du schaffst das!";
  app.innerHTML = `
    <div class="card center">
      <h2>Ergebnis</h2>
      <div class="big">${state.score} / ${n}</div>
      <p>${pct} % · ${msg}</p>
      ${state.wrong.length ? `<div class="review"><b>Das solltest du wiederholen:</b><ul>${state.wrong.map(w =>
        `<li>${esc(w.q.q)}<span>Richtig: ${esc(w.correct)}</span></li>`).join("")}</ul></div>` : ""}
      <div class="actions" style="justify-content:center">
        <button class="btn ghost" id="home">Themen</button>
        ${state.id !== "all" && LESSONS[state.id] ? `<button class="btn ghost" id="relearn">Lernkarten</button>` : ""}
        <button class="btn" id="again">Nochmal spielen</button>
      </div>
    </div>`;
  document.getElementById("home").onclick = home;
  document.getElementById("again").onclick = () => start(state.id);
  const relearn = document.getElementById("relearn");
  if (relearn) relearn.onclick = () => learn(state.id, 0);
}

home();
</script>
</body>
</html>
