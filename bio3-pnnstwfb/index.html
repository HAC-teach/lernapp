<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Biologie 3. Klasse</title>
<style>
  :root { --bg: #eef6f8; --card: #ffffff; --text: #16323d; --muted: #5b7380; --accent: #0e7c99; --border: #cfe0e6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1d23; --card: #172a32; --text: #e4f0f3; --muted: #93aab4; --accent: #4fc0dc; --border: #2a434d; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.8rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .list { display: grid; gap: 12px; }
  .chapter { display: flex; gap: 14px; align-items: center; background: var(--card); border: 2px solid var(--border);
    border-radius: 14px; padding: 16px; color: inherit; text-decoration: none; transition: border-color .15s, transform .15s; }
  a.chapter:hover { border-color: var(--accent); transform: translateY(-1px); }
  .chapter .ic { font-size: 2rem; }
  .chapter small { display: block; color: var(--muted); font-size: .9rem; }
  .chapter.soon { opacity: .55; }
</style>
</head>
<body>
<main>
  <h1>🔬 Biologie · 3. Klasse</h1>
  <p class="sub">Wähle ein Kapitel. Du kannst die Themen durchklicken und danach ein Quiz machen.</p>
  <div class="list">
    <!-- Neues Kapitel: Ordner anlegen und hier einen Link ergänzen -->
    <a class="chapter" href="gewaesser/"><span class="ic">🌊</span>
      <span><b>1. Gewässer</b><small>Wasserkreislauf · Fließ- & stehende Gewässer · Trinkwasser · Meer · Amphibien</small></span></a>
  </div>
</main>
</body>
</html>
