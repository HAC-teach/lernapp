<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Biologie 3. Klasse</title>
<style>
  :root { --paper: #fffaf0; --grid: #f1e8d6; --card: #ffffff; --text: #3d3528; --muted: #857a66; --border: #e6dcc6;
    --mark: #ffd96a; --top: #ffffff; --line: #f0b9b0; }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #1f1c17; --grid: #2a261f; --card: #28241e; --text: #ede5d6; --muted: #a89d88; --border: #3b352c;
      --mark: rgba(255, 200, 60, .35); --top: #24211b; --line: #6b3b36; }
  }
  .c1 { --c: #5a9be0; --ci: #2f6fb5; }
  @media (prefers-color-scheme: dark) { .c1 { --ci: #8bbcf0; } }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--text); background-color: var(--paper);
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 22px 22px; font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .top { background: var(--top); border-bottom: 3px double var(--line); padding: 12px 16px; color: var(--muted); font-size: .9rem; font-weight: 600; }
  .top span { display: block; max-width: 720px; margin: 0 auto; }
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { display: inline-block; font-size: 2rem; font-weight: 700; margin: 0 0 8px; padding: 0 4px;
    background: linear-gradient(transparent 60%, var(--mark) 60%); }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .list { display: grid; gap: 16px; }
  .chapter { display: block; background: var(--card); border: 1px solid var(--border); border-top: 5px solid var(--c);
    border-radius: 8px; color: inherit; text-decoration: none; box-shadow: 0 2px 0 var(--border); transition: transform .15s, box-shadow .15s; }
  a.chapter:hover { transform: translateY(-2px); box-shadow: 0 4px 0 var(--border); }
  .chapter .head { display: flex; gap: 12px; align-items: baseline; padding: 14px 16px; font-weight: 600; font-size: 1.1rem; }
  .chapter small { display: block; color: var(--muted); font-size: .9rem; padding: 8px 16px; border-top: 1px dashed var(--border); }
  .num { flex: none; color: var(--ci); font-weight: 800; font-size: 1.5rem; line-height: 1; }
  .chapter.soon { opacity: .55; }
  @media (max-width: 480px) { h1 { font-size: 1.6rem; } }
</style>
</head>
<body>
<header class="top"><span>Biologie · 3. Klasse</span></header>
<main>
  <h1>Kapitel</h1>
  <p class="sub">Wähle ein Kapitel. Du kannst die Themen durchklicken und danach ein Quiz machen.</p>
  <div class="list">
    <!-- Neues Kapitel: Ordner anlegen und hier einen Link ergänzen -->
    <a class="chapter c1" href="gewaesser/"><span class="head"><span class="num">1</span>Gewässer</span>
      <small>Wasserkreislauf · Fließ- & stehende Gewässer · Trinkwasser · Meer · Amphibien</small></a>
  </div>
</main>
</body>
</html>
